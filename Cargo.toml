[package]
name = "brenn-forgejo-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Stdio MCP server exposing Forgejo pull-request tools"
license = "Apache-2.0"
repository = "https://github.com/rnortman/brenn-forgejo-mcp"
readme = "README.md"
keywords = ["mcp", "forgejo", "pull-request", "claude", "stdio"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[dependencies]
anyhow = "1.0.102"
brenn-mcp = "0.1.0"
clap = { version = "4.6.0", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.28"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"

[dev-dependencies]
serial_test = "3.4.0"
tempfile = "3.27.0"
tokio = { version = "1.51.0", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"
